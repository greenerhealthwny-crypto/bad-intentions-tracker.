name: Sync health data

# Runs when:
#  - the receiving endpoint (endpoint/worker.js) forwards a Health Auto Export push
#  - the site's owner log commits data/manual-log.json
#  - daily, as a safety net, and on demand from the Actions tab
on:
  repository_dispatch:
    types: [health-data]
  push:
    branches: [main]
    paths: ['data/**']
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-health-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Merge Apple Health payload
        if: github.event_name == 'repository_dispatch'
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          printf '%s' "$PAYLOAD" > "$RUNNER_TEMP/payload.json"
          node scripts/ingest.mjs "$RUNNER_TEMP/payload.json"

      - name: Publish public data to docs/data
        run: node scripts/publish.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Sync health data $(date -u +%F)"
          # A log entry may have landed while this ran.
          git pull --rebase origin main
          git push origin HEAD:main
